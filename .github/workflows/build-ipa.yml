name: Build Versioned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Build Versioned BookSplitScanner.ipa on macOS
    runs-on: macos-15

    steps:
      - name: 1. Tải mã nguồn từ Repository
        uses: actions/checkout@v4

      - name: 2. Đọc số phiên bản (APP_VERSION) và số thứ tự bản dựng (Build Number)
        id: vars
        shell: bash
        run: |
          set -e
          VER=$(grep -Eo 'let APP_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' BookSplitScannerApp.swift | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -z "$VER" ]; then
            VER="2.1.0"
          fi
          BUILD_NUM="${{ github.run_number }}"
          IPA_NAME="BookSplitScanner-v${VER}-b${BUILD_NUM}.ipa"
          ARTIFACT_NAME="BookSplitScanner-v${VER}-b${BUILD_NUM}"
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          echo "Đang chuẩn bị tạo phiên bản: v${VER} (Build ${BUILD_NUM}) -> ${IPA_NAME}"

      - name: 3. Tạo cấu hình XcodeGen (project.yml) khóa hướng xoay hệ thống và gắn số phiên bản
        shell: bash
        run: |
          set -e
          cat << EOF > project.yml
          name: BookSplitScanner
          options:
            bundleIdPrefix: com.personal.booksplit
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.9"
              TARGETED_DEVICE_FAMILY: "1,2"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              MARKETING_VERSION: "${APP_VERSION}"
              CURRENT_PROJECT_VERSION: "${BUILD_NUM}"
          targets:
            BookSplitScanner:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: .
                  includes:
                    - "**/*.swift"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.personal.booksplit.scanner
                  INFOPLIST_FILE: Info.plist
                  GENERATE_INFOPLIST_FILE: NO
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: "BookSplit"
                  CFBundleName: "BookSplitScanner"
                  CFBundleIdentifier: "\$(PRODUCT_BUNDLE_IDENTIFIER)"
                  CFBundleExecutable: "\$(EXECUTABLE_NAME)"
                  CFBundlePackageType: "\$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
                  CFBundleShortVersionString: "${APP_VERSION}"
                  CFBundleVersion: "${BUILD_NUM}"
                  LSRequiresIPhoneOS: true
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UILaunchScreen: {}
                  NSCameraUsageDescription: "Ứng dụng cần quyền truy cập Camera sắc nét của iPhone để quét và tự động tách 2 trang sách."
                  NSPhotoLibraryUsageDescription: "Ứng dụng cần quyền truy cập Thư viện ảnh để nhập ảnh trang sách và tách trang tự động."
                  NSPhotoLibraryAddUsageDescription: "Ứng dụng cần quyền lưu ảnh trang sách đã tách vào Thư viện ảnh."
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
          EOF

      - name: 4. Cài đặt XcodeGen và khởi tạo dự án Xcode (.xcodeproj)
        shell: bash
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 5. Biên dịch ứng dụng iOS (Release - v${{ env.APP_VERSION }} Build ${{ env.BUILD_NUM }})
        shell: bash
        run: |
          xcodebuild clean build             -project BookSplitScanner.xcodeproj             -scheme BookSplitScanner             -configuration Release             -sdk iphoneos             -derivedDataPath build_output             MARKETING_VERSION="${APP_VERSION}"             CURRENT_PROJECT_VERSION="${BUILD_NUM}"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 6. Ký Ad-Hoc và đóng gói thành file ${{ env.IPA_NAME }}
        shell: bash
        run: |
          rm -rf Payload *.ipa
          mkdir -p Payload
          APP_PATH=$(find build_output -name "BookSplitScanner.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          codesign --force --deep --sign - Payload/BookSplitScanner.app
          zip -r9 "${IPA_NAME}" Payload
          ls -lh "${IPA_NAME}"

      - name: 7. Tải file ${{ env.IPA_NAME }} lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30
